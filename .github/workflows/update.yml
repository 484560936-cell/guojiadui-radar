name: ETF数据采集与部署
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 1-7 * * 1-5'
    - cron: '45 15 * * 1-5'
    # 全球市场快照：北京时间每日 07:15、16:15、23:15
    - cron: '15 23 * * *'
    - cron: '15 8,15 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: etf-dashboard
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 采集公开数据
        run: python collector.py
      - name: ATLAS 全球日线与新闻快照
        run: |
          python atlas/collector.py || echo "::warning::ATLAS 本次采集未成功，保留已有数据"
      - name: 验证数据JSON
        run: python -m json.tool data/dashboard.json >/dev/null
      - name: 保存采集历史
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard.json
          if [ -f atlas/data/overview.json ]; then
            git add atlas/data/overview.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public ETF"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "ETF data committed successfully"
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "Failed to save collected data after retries" >&2
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 组装站点
        run: |
          mkdir -p public/data
          cp index.html public/
          cp data/dashboard.json public/data/
          mkdir -p public/atlas/data
          cp atlas/index.html public/atlas/index.html
          if [ -f atlas/data/overview.json ]; then
            cp atlas/data/overview.json public/atlas/data/overview.json
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
